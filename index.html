.hero-wrap{position:relative;container-type:inline-size}
.hero-title{position:absolute;left:0;top:0;width:58%;height:89%;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:var(--display);font-weight:400;color:var(--ink);pointer-events:none}
.hero-title .l1{font-size:clamp(14px,3.4vw,28px);font-size:3.5cqw;line-height:1.2}
.hero-title .l2{font-size:clamp(40px,10vw,84px);font-size:10.6cqw;line-height:1.05;letter-spacing:.01em}
.hero-img{display:block;width:100%;height:auto;aspect-ratio:1080/340;background:var(--cream)}
.inner{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ── 머리말 ── */
.intro{display:flex;flex-direction:column;gap:10px;padding-block:18px 8px}
.intro h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,5.4vw,32px);line-height:1.25;margin:0;color:var(--ink)}
.intro h2 span{color:var(--fox)}
.eyebrow{font-size:13.5px;color:var(--muted);font-weight:500}
.intro p{margin:0;color:var(--muted);max-width:52ch;font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.facts b{font-variant-numeric:tabular-nums}
.facts svg{color:var(--fox)}

main .inner{display:flex;flex-direction:column;gap:20px;padding-block:14px 50px}

/* ── 일과 시간표 ── */
.bell{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;display:flex;align-items:center;gap:8px}
.sec-head h2 svg{flex:none}
.sec-head span{font-size:12.5px;color:var(--muted)}
.bell-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) .72fr repeat(2,minmax(0,1fr));gap:8px}
.slot{appearance:none;font:inherit;color:inherit;text-align:left;border:1.5px solid var(--line);background:var(--paper-2);border-radius:14px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;transition:background .15s,border-color .15s,transform .12s}
.slot:hover{border-color:var(--fox);transform:translateY(-1px)}
.slot .num{display:flex;align-items:baseline;gap:2px}
.slot .num b{font-family:var(--display);font-weight:400;font-size:27px;line-height:1;color:var(--fox-deep)}
.slot .num small{font-size:12px;color:var(--muted);font-weight:600}
.slot .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.slot[aria-pressed="true"]{background:var(--fox);border-color:var(--fox);color:#fff;box-shadow:0 3px 0 var(--fox-deep)}
.slot[aria-pressed="true"] .num b,.slot[aria-pressed="true"] .t,.slot[aria-pressed="true"] .num small{color:#fff}
.slot[aria-pressed="true"] .dots i{box-shadow:0 0 0 1.5px #fff}
.slot.lunch{cursor:default;background:transparent;border-style:dashed;justify-content:center;align-items:center;text-align:center}
.slot.lunch:hover{border-color:var(--line);transform:none}
.slot.lunch b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--muted)}
.slot.now{box-shadow:0 0 0 2.5px var(--leaf)}
.now-tag{font-size:11px;font-weight:700;color:var(--s-pe)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ── 필터 ── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dd{position:relative}
.dd-btn{appearance:none;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px 9px 16px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;max-width:80vw;transition:border-color .15s}
.dd-btn:hover{border-color:var(--fox)}
.dd-btn .lbl{color:var(--muted)}
.dd-btn .val{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn.on{border-color:var(--fox);background:#fff1e2}
.dd-btn.on .val{color:var(--fox-deep)}
.dd-btn svg{flex:none;color:var(--muted)}
.dd-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:20;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(120,70,20,.18);padding:6px;min-width:220px;max-width:calc(100vw - 36px)}
.dd-panel label{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.dd-panel label:hover{background:var(--paper-2)}
.dd-panel input{width:18px;height:18px;accent-color:var(--fox);flex:none;margin:0}
.dd-panel .meta{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dd-panel .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dd-foot{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line);margin-top:4px;padding:6px 4px 2px}
.linkbtn{appearance:none;background:none;border:0;font:inherit;font-size:13px;color:var(--fox-deep);font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px}
.reset{margin-left:auto}
.sheet-title,.backdrop{display:none}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;background:var(--outer);border-radius:999px;padding:4px}
.tabs button{appearance:none;border:0;background:none;font-family:var(--display);font-size:15px;color:var(--muted);padding:6px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--fox-deep);box-shadow:0 2px 0 var(--line-2)}

/* ── 교시별 ── */
.periods{display:flex;flex-direction:column;gap:26px}
.p-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);display:flex;align-items:center;gap:10px;padding-block:8px}
.p-badge{display:inline-flex;align-items:baseline;gap:2px;background:var(--fox);color:#fff;border-radius:999px;padding:4px 14px 5px;box-shadow:0 3px 0 var(--fox-deep)}
.p-badge b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.p-badge span{font-family:var(--display);font-size:15px}
.p-head .pt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--cream);padding:2px 8px;border-radius:8px}
.p-head .rule{flex:1;border-top:2px dotted var(--line-2)}
.p-head .pc{font-size:12.5px;color:var(--muted);background:var(--cream);padding:2px 6px;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 4px 0 var(--line)}
.card-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subj{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c);background:var(--paper-2);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px 3px 8px;border-radius:999px}
.subj::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.grade{font-size:12.5px;color:var(--muted);font-weight:500}
.topic{font-weight:700;font-size:16.5px;line-height:1.42;margin:0;text-wrap:pretty}
.topic small{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:3px}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1.5px dashed var(--line)}
/* 나무 팻말 */
.plate{position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;background:var(--wood);color:var(--wood-ink);border-radius:7px;padding:6px 14px 7px;line-height:1.15;min-width:0;
  background-image:repeating-linear-gradient(176deg,rgba(255,255,255,.06) 0 2px,transparent 2px 7px);box-shadow:0 3px 0 #63391a}
.plate::before,.plate::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:#e9c891}
.plate::before{left:5px}.plate::after{right:5px}
.plate small{font-size:10.5px;opacity:.85}
.plate b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;white-space:nowrap}
.tch{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;white-space:nowrap;padding-bottom:3px}
.tch span{color:var(--muted);font-weight:400}
.lunchline{display:flex;align-items:center;gap:12px;color:var(--fox-deep);font-family:var(--display);font-size:16px}
.lunchline::before,.lunchline::after{content:"";flex:1;border-top:2px dotted var(--line-2)}

/* ── 전체 표 ── */
.tablebox{overflow-x:auto;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1.5px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--paper-2)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.c-p b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--fox-deep)}
tbody tr:last-child td{border-bottom:0}
tr.pstart td{border-top:2.5px solid var(--line-2)}
td.c-room b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--wood)}
td.c-room,td.c-tch{white-space:nowrap}
.c-topic{font-weight:600}
.c-topic .sub{display:block;color:var(--muted);font-size:13px;font-weight:400}

.empty{background:var(--paper);border:1.5px dashed var(--line-2);border-radius:20px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px}
footer .inner{padding-block:6px 30px;font-size:12.5px;color:var(--muted);text-align:center}

/* ── 모바일 ── */
@media (max-width:640px){
  body{font-size:16px;background:var(--cream)}
  .page{box-shadow:none}
  .intro{padding-block:14px 4px}
  .intro h2{font-size:24px}
  .intro p{font-size:14.5px}
  .facts span{font-size:13px;padding:4px 11px}
  main .inner{gap:16px}
  .bell{padding:14px;border-radius:20px;gap:12px}
  .sec-head span{display:none}
  .bell-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .slot.lunch{display:none}
  .slot .num b{font-size:25px}

  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .dd{position:static;min-width:0}
  .dd-btn{width:100%;max-width:none;border-radius:14px;padding:12px 12px 12px 14px;font-size:15px}
  .dd-btn .val{flex:1;min-width:0;text-align:left}
  .reset{grid-column:1/-1;justify-self:end;margin:0}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(60,35,15,.4);z-index:30}
  .dd-panel{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:40;min-width:0!important;max-width:none;max-height:80vh;overflow-y:auto;border-radius:24px 24px 0 0;border-bottom:0;
    padding:6px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
  .dd-panel::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:6px auto 0}
  .sheet-title{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:20px;padding:12px 10px 8px}
  .sheet-title span{font-family:var(--body);font-size:13px;color:var(--muted)}
  .dd-panel label{padding:13px 10px;font-size:16px;gap:12px}
  .dd-panel input{width:22px;height:22px}
  .dd-foot{position:sticky;bottom:calc(-10px - env(safe-area-inset-bottom,0px));background:var(--paper);padding:10px 0 6px}
  .linkbtn{font-size:15px;padding:10px 12px}
  .done{background:var(--fox);color:#fff;border-radius:14px;padding:11px 28px;box-shadow:0 3px 0 var(--fox-deep)}

  .tabs{width:100%}
  .tabs button{flex:1;padding:9px 0;font-size:16px}

  .periods{gap:20px}
  .cards{grid-template-columns:1fr;gap:12px}
  .topic{font-size:17px}

  .tablebox{background:transparent;border:0;border-radius:0;overflow:visible;box-shadow:none}
  table{min-width:0;font-size:15px}
  table,tbody{display:block}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:10px}
  tr{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"p time" "topic topic" "subj subj" "room tch";
     background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;row-gap:6px;box-shadow:0 3px 0 var(--line)}
  td{display:block;padding:0;border:0!important}
  .c-p{grid-area:p} .c-time{grid-area:time;color:var(--muted);padding-left:8px;align-self:center;font-size:14px}
  .c-g{display:none!important}
  .c-subj{grid-area:subj}
  .c-subj .grade{margin-left:6px}
  .c-topic{grid-area:topic;line-height:1.45}
  .c-room,.c-tch{border-top:1.5px dashed var(--line)!important;padding-top:9px;margin-top:2px;font-size:14.5px}
  .c-room{grid-area:room} .c-tch{grid-area:tch;text-align:right}
}
@media (min-width:641px){ .c-subj .grade{display:none} }
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--outer)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<script>
// 수업 공개일(YYYY-MM-DD). 넣으면 머리띠에 날짜가 표시되고, 당일에는 진행 중인 교시가 강조됩니다.
const EVENT_DATE = "";

const SLOTS = [
  {p:1,s:"9:00",e:"9:45"},{p:2,s:"9:55",e:"10:40"},{p:3,s:"10:50",e:"11:35"},
  {p:4,s:"11:45",e:"12:30"},{p:5,s:"13:20",e:"14:05"},{p:6,s:"14:15",e:"15:00"}
];
const SUBJ_COLOR = {"국어":"--s-kor","수학":"--s-math","과학":"--s-sci","역사":"--s-hist","체육":"--s-pe","가정":"--s-home"};
const LESSONS = [
  {g:3,subj:"국어",topic:"논리 수사대, 설득의 비밀을 밝혀라!",t:"이○리",ses:[[5,"3-14"],[6,"3-13"]]},
  {g:3,subj:"과학",topic:"롤러코스터의 비밀",sub:"역학적 에너지 보존 법칙을 찾아라!",t:"변○원",ses:[[4,"3-7"],[5,"3-9"]]},
  {g:3,subj:"과학",topic:"시뮬레이션 기반 미지의 별 찾기",t:"이○연",ses:[[3,"3-1"],[4,"3-4"]]},
  {g:3,subj:"과학",topic:"디지털 센서를 활용하여 빛의 역제곱 법칙 검증하기",t:"정○화",ses:[[1,"3-13"],[2,"3-14"]]},
  {g:3,subj:"수학",topic:"원의 성질 복습, 내 손으로 그려보자",t:"오○주",ses:[[2,"3-5"],[5,"3-4"]]},
  {g:3,subj:"역사",topic:"수원 화성, 내 손으로 수리한다.",t:"오○욱",ses:[[3,"3-11"],[6,"3-14"]]},
  {g:3,subj:"체육",topic:"줄넘기 빙고 수행평가",t:"김○영",ses:[[1,"중정"],[2,"중정"]]},
  {g:2,subj:"과학",topic:"저항, 전류, 전압 사이의 관계 탐구하기",t:"신○화",ses:[[3,"과학실 B305"],[6,"과학실 B305"]]},
  {g:2,subj:"가정",topic:"알고리즘 쇼핑몰을 탈출하라!",t:"도○경",ses:[[1,"2-10"],[2,"2-12"]]},
];
const ROWS = [];
LESSONS.forEach((l,i)=>l.ses.forEach(([p,room])=>ROWS.push({...l,lid:i,p,room})));
ROWS.sort((a,b)=>a.p-b.p || a.g-b.g || a.subj.localeCompare(b.subj,"ko"));

const slot = p => SLOTS.find(s=>s.p===p);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cvar = subj => `--c:var(${SUBJ_COLOR[subj]})`;
function plateParts(r){
  const m=r.match(/^(\d)-(\d+)$/); if(m) return [`${m[1]}학년 ${m[2]}반`, r];
  const lab=r.match(/^(.+?)\s+([A-Z]\d+)$/); if(lab) return [lab[1], lab[2]];
  return ["장소", r];
}
function plate(r){ const [s,b]=plateParts(r); return `<span class="plate"><small>${esc(s)}</small><b>${esc(b)}</b></span>`; }
function roomText(r){ const [s,b]=plateParts(r); return s==="장소"?esc(b):`<b>${esc(b)}</b> <span style="color:var(--muted)">${esc(s)}</span>`; }

const FILTERS = [
  {key:"p",label:"교시",opts:SLOTS.map(s=>({v:s.p,txt:`${s.p}교시`,meta:`${s.s}~${s.e}`}))},
  {key:"subj",label:"과목",opts:Object.keys(SUBJ_COLOR).map(v=>({v,txt:v,sw:v}))},
  {key:"g",label:"학년",opts:[{v:2,txt:"2학년"},{v:3,txt:"3학년"}]},
  {key:"lid",label:"수업",wide:true,opts:LESSONS.map((l,i)=>({v:i,txt:l.topic.replace(/[.!]$/,""),sw:l.subj}))},
];
const state = {sel:{p:new Set(),subj:new Set(),g:new Set(),lid:new Set()}, view:"time", open:null};
try{ const v=localStorage.getItem("oc-view"); if(v==="table"||v==="time") state.view=v; }catch(e){}

const filtered = () => ROWS.filter(r=>FILTERS.every(f=>!state.sel[f.key].size || state.sel[f.key].has(r[f.key])));
const countFor = (key,v) => ROWS.filter(r=>r[key]===v).length;

function nowPeriod(){
  if(!EVENT_DATE) return null;
  const d=new Date(); const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if(iso!==EVENT_DATE) return null;
  const m=d.getHours()*60+d.getMinutes(); const toM=t=>{const[h,mm]=t.split(":").map(Number);return h*60+mm};
  const s=SLOTS.find(s=>m>=toM(s.s)-5&&m<toM(s.e)); return s?s.p:null;
}

const ico = {
  cal:`<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>`,
  clock:`<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>`,
  book:`<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 3.5c2-1 4-1 6 .5 2-1.5 4-1.5 6-.5v9c-2-1-4-1-6 .5-2-1.5-4-1.5-6-.5z"/><path d="M8 4v9"/></svg>`,
  chev:`<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

function renderFacts(){
  const parts=[];
  if(EVENT_DATE){ const d=new Date(EVENT_DATE+"T00:00:00"); const w="일월화수목금토"[d.getDay()];
    parts.push(`<span>${ico.cal}<b>${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.(${w})</b></span>`); }
  parts.push(`<span>${ico.clock}<b>09:00 ~ 15:00</b></span>`);
  document.getElementById("facts").innerHTML=parts.join("");
  document.getElementById("legend").innerHTML=Object.keys(SUBJ_COLOR).map(s=>`<span style="${cvar(s)}"><i></i>${s}</span>`).join("");
}

function renderBell(){
  const now=nowPeriod(); const el=document.getElementById("bell");
  const parts=SLOTS.map(s=>{
    const dots=ROWS.filter(r=>r.p===s.p).map(r=>`<i style="${cvar(r.subj)}"></i>`).join("");
    return `<button class="slot${now===s.p?" now":""}" data-p="${s.p}" aria-pressed="${state.sel.p.has(s.p)}" aria-label="${s.p}교시 ${s.s}부터 ${s.e}까지, 수업 ${countFor("p",s.p)}개">
      <span class="num"><b>${s.p}</b><small>교시</small>${now===s.p?'<span class="now-tag">&nbsp;진행 중</span>':""}</span>
      <span class="t">${s.s}~${s.e}</span><span class="dots">${dots}</span></button>`;});
  parts.splice(4,0,`<div class="slot lunch"><b>점심</b><span class="t">12:30~13:20</span></div>`);
  el.innerHTML=parts.join("");
  el.querySelectorAll("button.slot").forEach(b=>b.onclick=()=>{
    const p=+b.dataset.p; const s=state.sel.p; s.has(p)?s.delete(p):s.add(p); render();
  });
}

function renderFilters(){
  const el=document.getElementById("filters");
  const any=Object.values(state.sel).some(s=>s.size);
  el.innerHTML=FILTERS.map(f=>{
    const s=state.sel[f.key]; const on=s.size>0;
    let val="전체";
    if(on){ const names=f.opts.filter(o=>s.has(o.v)).map(o=>o.txt);
      val = names.length>2 ? `${names[0]} 외 ${names.length-1}` : names.join(", "); }
    const panel = state.open===f.key ? `<div class="dd-panel" role="group" aria-label="${f.label} 선택" style="${f.wide?"min-width:min(360px,calc(100vw - 36px))":""}">
        <div class="sheet-title">${f.label} 선택 <span>여러 개 고를 수 있어요</span></div>
        ${f.opts.map((o,i)=>`<label><input type="checkbox" id="f-${f.key}-${i}" data-k="${f.key}" data-v="${o.v}" ${s.has(o.v)?"checked":""}>${o.sw?`<i class="sw" style="${cvar(o.sw)}"></i>`:""}<span>${esc(o.txt)}</span><span class="meta">${o.meta||countFor(f.key,o.v)+"회"}</span></label>`).join("")}
        <div class="dd-foot"><button class="linkbtn" data-clear="${f.key}">선택 해제</button><button class="linkbtn done" data-close="1">완료</button></div>
      </div><div class="backdrop"></div>` : "";
    return `<div class="dd"><button class="dd-btn${on?" on":""}" id="dd-${f.key}" data-open="${f.key}" aria-expanded="${state.open===f.key}"><span class="lbl">${f.label}</span><span class="val">${esc(val)}</span>${ico.chev}</button>${panel}</div>`;
  }).join("") + (any?`<button class="linkbtn reset" id="reset">필터 모두 해제</button>`:"");

  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation(); state.open = state.open===b.dataset.open?null:b.dataset.open; render();});
  el.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{
    const k=c.dataset.k; const v=k==="subj"?c.dataset.v:+c.dataset.v;
    c.checked?state.sel[k].add(v):state.sel[k].delete(v); render();
    const again=document.getElementById(c.id); if(again) again.focus({preventScroll:true});
  });
  el.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{state.sel[b.dataset.clear].clear(); render();});
  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{const k=state.open; state.open=null; render(); document.getElementById("dd-"+k)?.focus();});
  el.querySelectorAll(".dd-panel").forEach(p=>p.onclick=e=>e.stopPropagation());
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{Object.values(state.sel).forEach(s=>s.clear()); state.open=null; render();};
}

const subjTag = r => `<span class="subj" style="${cvar(r.subj)}">${r.subj}</span>`;

function renderView(){
  const rows=filtered(); const el=document.getElementById("view");
  const lessons=new Set(rows.map(r=>r.lid)).size;
  document.getElementById("count").innerHTML = `수업 <b>${lessons}</b>개 · 공개 <b>${rows.length}</b>회`;
  document.getElementById("tab-time").setAttribute("aria-selected",state.view==="time");
  document.getElementById("tab-table").setAttribute("aria-selected",state.view==="table");
  if(!rows.length){ el.innerHTML=`<div class="empty">선택한 조건에 맞는 수업이 없습니다.<button class="linkbtn" id="empty-reset">필터 모두 해제</button></div>`;
    document.getElementById("empty-reset").onclick=()=>{Object.values(state.sel).forEach(s=>s.clear()); render();}; return; }

  if(state.view==="time"){
    const ps=[...new Set(rows.map(r=>r.p))]; let html=""; let lunchDone=false;
    ps.forEach(p=>{
      if(p>=5 && !lunchDone && ps.some(x=>x<=4)){ html+=`<div class="lunchline">점심 12:30 ~ 13:20</div>`; lunchDone=true; }
      const s=slot(p); const list=rows.filter(r=>r.p===p);
      html+=`<section><div class="p-head"><span class="p-badge"><b>${p}</b><span>교시</span></span><span class="pt">${s.s} ~ ${s.e}</span><span class="rule"></span><span class="pc">${list.length}개 수업</span></div><div class="cards">`+
        list.map(r=>`<article class="card">
          <div class="card-head">${subjTag(r)}<span class="grade">${r.g}학년</span></div>
          <h3 class="topic">${esc(r.topic)}${r.sub?`<small>${esc(r.sub)}</small>`:""}</h3>
          <div class="card-foot">${plate(r.room)}<span class="tch">${esc(r.t)}<span>선생님</span></span></div>
        </article>`).join("")+`</div></section>`;
    });
    el.innerHTML=`<div class="periods">${html}</div>`;
  } else {
    let prev=null;
    el.innerHTML=`<div class="tablebox"><table><thead><tr><th>교시</th><th>시간</th><th>학년</th><th>과목</th><th>수업 주제</th><th>장소</th><th>수업자</th></tr></thead><tbody>`+
      rows.map(r=>{const s=slot(r.p); const start=prev!==null&&prev!==r.p; prev=r.p;
        return `<tr class="${start?"pstart":""}"><td class="num c-p"><b>${r.p}</b>교시</td><td class="num c-time">${s.s}~${s.e}</td><td class="num c-g">${r.g}학년</td><td class="c-subj">${subjTag(r)}<span class="grade">${r.g}학년</span></td><td class="c-topic">${esc(r.topic)}${r.sub?`<span class="sub">${esc(r.sub)}</span>`:""}</td><td class="c-room">${roomText(r.room)}</td><td class="c-tch">${esc(r.t)}</td></tr>`;}).join("")+
      `</tbody></table></div>`;
  }
}

function render(){ renderBell(); renderFilters(); renderView(); }
function setView(v){ state.view=v; try{localStorage.setItem("oc-view",v)}catch(e){} renderView(); }
document.getElementById("tab-time").onclick=()=>setView("time");
document.getElementById("tab-table").onclick=()=>setView("table");
document.addEventListener("click",()=>{ if(state.open){ state.open=null; renderFilters(); }});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&state.open){ const k=state.open; state.open=null; renderFilters(); document.getElementById("dd-"+k)?.focus(); }});
renderFacts(); render();
setInterval(()=>{ if(EVENT_DATE) renderBell(); },60000);
</script>
</body>
</html>
